version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 58ec2667-a9f4-455b-b89b-914fe565b7ea
    ports:
      - "8200:8200"

  consul:
    image: hashicorp/consul:latest
    command: "agent -dev"
    ports:
      - "8500:8500"
  minio:
    image: minio/minio
    ports:
      - '9000:9000'
    #    volumes:
    #      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data
  
  redis:
    image: redis:latest

  api-gateway:
    build:
      context: .
      dockerfile: ./ApiGateway/Api/Dockerfile

  identity-management:
    build:
      context: .
      dockerfile: ./IdentityManagement/src/AdvertisingSystem.Identity.Api/Dockerfile
    depends_on:
      - postgres
      - vault
      - consul

  advertisement-management:
    build:
      context: .
      dockerfile: ./AdvertisementManagement/src/AdvertisingSystem.Api/Dockerfile
    depends_on:
      - postgres
      - vault
      - consul
  
  email-sender:
    build:
      context: .
      dockerfile: ./EmailSender/Dockerfile
    depends_on:
      - vault
      - consul
      - rabbitmq

  thumbnail-management:
    build:
      context: .
      dockerfile: ./ThumbnailManagement/Dockerfile
    depends_on:
      - minio
      - postgres
      - vault
      - consul
  
  category-management:
    build:
      context: .
      dockerfile: ./CategoryManagement/Dockerfile
    depends_on:
      - postgres
      - vault
      - consul

################################################
networks:
  default:
    external:
      name: bridge
